name: al_tanbeeh_alarm
description: A modern Flutter alarm clock application with multiple alarms, daily repeat, custom ringtones, and auto-snooze.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.0
  audioplayers: ^6.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
